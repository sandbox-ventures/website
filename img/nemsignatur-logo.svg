<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 50" fill="none">
  <!-- Funnel Display is the Nemsignatur brand face. An SVG in an <img> cannot
       fetch a webfont, so the latin subset is embedded; without it the wordmark
       falls back to whatever the viewer has installed. -->
  <style>@font-face{font-family:"Funnel Display";font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}</style>
  <!-- Drawn in white for the coloured product card, matching the other logos. -->
  <g transform="scale(1.315789)">
    <rect width="38" height="38" rx="9" fill="white" fill-opacity="0.2"/>
    <path d="M9 25.5c4.2-13 7.5-13 9.4-6.8 1.2 3.9 2.3 6.8 4 6.8 2.1 0 3.3-4 6.6-9.5" fill="none" stroke="white" stroke-width="2.9" stroke-linecap="round"/>
  </g>
  <text x="67" y="37.6" font-family="Funnel Display" font-size="35" font-weight="600" letter-spacing="-0.875" fill="white">Nemsignatur</text>
</svg>
